- name: images_oncommand_cam_depth
  path: /tmp/images_oncommand_cam_depth
- name: images_streaming_cam_depth
  path: /tmp/images_streaming_cam_depth
- name: images_depth_NavCam_left
  path: /tmp/images_depth_NavCam_left
- name: images_oncommand_NavCam_left
  path: /tmp/images_oncommand_NavCam_left
- name: images_streaming_NavCam_left
  path: /tmp/images_streaming_NavCam_left
- name: images_depth_NavCam_right
  path: /tmp/images_depth_NavCam_right
- name: images_oncommand_NavCam_right
  path: /tmp/images_oncommand_NavCam_right
- name: images_streaming_NavCam_right
  path: /tmp/images_streaming_NavCam_right
