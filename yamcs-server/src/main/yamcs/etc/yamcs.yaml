services:
  - class: org.yamcs.http.HttpServer
    args:
      port: 8090
      address: "0.0.0.0"
      cors:
        allowOrigin: "*"
        allowCredentials: false # disabled if not using authentication
        # allowCredentials: true  # Required for authentication

# This is where Yamcs will persist its data. Paths are resolved relative to where Yamcs is running
# from (by default: target/yamcs). This means that `mvn clean` will remove also persisted data.
dataDir: yamcs-data
# Change this property to an absolute path in case you want to persist your data.
# dataDir: /storage/yamcs-data

instances:
  - workshop

# Secret key unique to a particular Yamcs installation.
# This is used to provide cryptographic signing.
secretKey: changeme

# The image buckets (images_*) are generated by mdb/generate_mdb_rover.py from the OmniLRS robot and controller
# config (see mdb/_mdb_cli.py for their directory and limits): edit them there, not here.
buckets:
  # Command stacks shown in Yamcs Web (its default stack bucket is 'stacks').
  # Relative to the run directory (target/yamcs), so stacks saved from Yamcs Web land in the repo.
  - name: stacks
    path: ../../src/main/yamcs/stacks
  - name: images_cam_depth_depth
    path: images/images_cam_depth_depth
    maxSize: 107374182400
    maxObjects: 1000000
  - name: images_NavCam_left_streaming
    path: images/images_NavCam_left_streaming
    maxSize: 107374182400
    maxObjects: 1000000
  - name: images_NavCam_left_oncommand
    path: images/images_NavCam_left_oncommand
    maxSize: 107374182400
    maxObjects: 1000000
  - name: images_NavCam_right_streaming
    path: images/images_NavCam_right_streaming
    maxSize: 107374182400
    maxObjects: 1000000
  - name: images_NavCam_right_oncommand
    path: images/images_NavCam_right_oncommand
    maxSize: 107374182400
    maxObjects: 1000000
  - name: images_lander
    path: images/images_lander
    maxSize: 107374182400
    maxObjects: 1000000
  - name: images_monitoring
    path: images/images_monitoring
    maxSize: 107374182400
    maxObjects: 1000000
  - name: images_apxs
    path: images/images_apxs
    maxSize: 107374182400
    maxObjects: 1000000
